<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">Active-vision camera robot workflow</title><desc id="desc">Conceptual visual tracking and control loop with a two-degree-of-freedom platform and three-degree-of-freedom camera module, supporting physiological video acquisition.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6484a5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#243b53"><text x="30" y="35" text-anchor="start" font-size="13" fill="#4d7195"><tspan x="30" dy="0">ACTIVE-VISION TRACKING · DESIGN WORKFLOW</tspan></text><rect x="30" y="70" width="230" height="85" rx="7" fill="#eff5fb" stroke="#ccdbea"/><text x="145.0" y="106.65" text-anchor="middle" font-size="15" fill="#243b53"><tspan x="145.0" dy="0">Person on treadmill</tspan><tspan x="145.0" dy="21.75">Head position / orientation</tspan></text><path d="M260 112L320 112" fill="none" stroke="#6484a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="70" width="245" height="85" rx="7" fill="#eff5fb" stroke="#ccdbea"/><text x="447.5" y="106.65" text-anchor="middle" font-size="15" fill="#243b53"><tspan x="447.5" dy="0">Stereo-camera acquisition</tspan><tspan x="447.5" dy="21.75">Images + depth estimate</tspan></text><path d="M570 112L625 112" fill="none" stroke="#6484a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="630" y="70" width="240" height="85" rx="7" fill="#eff5fb" stroke="#ccdbea"/><text x="750.0" y="106.65" text-anchor="middle" font-size="15" fill="#243b53"><tspan x="750.0" dy="0">Face / head-pose estimation</tspan><tspan x="750.0" dy="21.75">Position · pose · distance</tspan></text><path d="M750 155 V195 H450 V227" fill="none" stroke="#6484a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="232" width="245" height="85" rx="7" fill="#eff5fb" stroke="#ccdbea"/><text x="447.5" y="268.65" text-anchor="middle" font-size="15" fill="#243b53"><tspan x="447.5" dy="0">Tracking controller</tspan><tspan x="447.5" dy="21.75">Alignment + distance errors</tspan></text><path d="M570 274L625 274" fill="none" stroke="#6484a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="630" y="232" width="240" height="85" rx="7" fill="#eff5fb" stroke="#ccdbea"/><text x="750.0" y="268.65" text-anchor="middle" font-size="15" fill="#243b53"><tspan x="750.0" dy="0">Positioning mechanisms</tspan><tspan x="750.0" dy="21.75">2-DOF platform + 3-DOF camera</tspan></text><path d="M870 274 H887 V184 H447 V158" fill="none" stroke="#6484a5" stroke-width="2" marker-end="url(#arrow)"/><text x="745" y="207" text-anchor="middle" font-size="13" fill="#243b53"><tspan x="745" dy="0">Visual feedback loop</tspan></text><rect x="30" y="232" width="230" height="85" rx="7" fill="#edf5f1" stroke="#ccdbea"/><text x="145.0" y="258.96" text-anchor="middle" font-size="14" fill="#243b53"><tspan x="145.0" dy="0">Engineering contribution</tspan><tspan x="145.0" dy="20.3">CAD · DH kinematics</tspan><tspan x="145.0" dy="20.3">MATLAB workspace</tspan></text><path d="M260 274L320 274" fill="none" stroke="#6484a5" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M447 155 V174 H298 V389 H324" fill="none" stroke="#6484a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="325" y="354" width="245" height="75" rx="7" fill="#eff5fb" stroke="#ccdbea"/><text x="447.5" y="385.65" text-anchor="middle" font-size="15" fill="#243b53"><tspan x="447.5" dy="0">Aligned facial video</tspan><tspan x="447.5" dy="21.75">Input for rPPG analysis</tspan></text><path d="M570 391L625 391" fill="none" stroke="#6484a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="630" y="354" width="240" height="75" rx="7" fill="#f3f5f8" stroke="#ccdbea"/><text x="750.0" y="386.04" text-anchor="middle" font-size="14" fill="#243b53"><tspan x="750.0" dy="0">Physiological features</tspan><tspan x="750.0" dy="20.3">Intended monitoring application</tspan></text><text x="30" y="485" text-anchor="start" font-size="14" fill="#66788a"><tspan x="30" dy="0">Conceptual architecture, not a validated clinical system.</tspan><tspan x="30" dy="20.3">Pan + tilt + radial translation define the 3-DOF camera module.</tspan></text></g></svg>