<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">ST-SHAP architecture for EEG emotion recognition</title>
<desc id="desc">Differential entropy features from five EEG frequency bands form scalp maps. Four temporal frames are stacked as channels and processed using patch embedding and four Swin stages. A classifier predicts emotion classes; post-hoc SHAP explains the input segments.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#6d89a7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#9a7bb7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1280" height="440" fill="white"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#243f60">
<rect x="20" y="18" width="192" height="94" rx="12" fill="#f3f7fc" stroke="#cfdeee" stroke-width="1.4"/><text x="116" y="55" text-anchor="middle" font-size="20" fill="#243f60" font-weight="600">64-channel EEG</text><text x="116" y="84" text-anchor="middle" font-size="17" fill="#617991">5 frequency bands</text><path d="M214 65 H237" fill="none" stroke="#6d89a7" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="242" y="18" width="218" height="94" rx="12" fill="#f3f7fc" stroke="#cfdeee" stroke-width="1.4"/><text x="351" y="55" text-anchor="middle" font-size="19" fill="#243f60" font-weight="600">Differential entropy</text><text x="351" y="84" text-anchor="middle" font-size="17" fill="#617991">32 × 32 scalp maps</text><path d="M351 113 V130 H240 V146" fill="none" stroke="#6d89a7" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="20" y="150" width="440" height="103" rx="12" fill="#eef7f4" stroke="#c8e0d8" stroke-width="1.4"/><text x="240" y="183" text-anchor="middle" font-size="20" fill="#306557" font-weight="600">Four consecutive temporal frames</text><text x="240" y="212" text-anchor="middle" font-size="18" fill="#477366">Input tensor: 4 × 32 × 32</text><rect x="194" y="229" width="19" height="5" rx="2.5" fill="#b4d5c8"/><rect x="218" y="229" width="19" height="5" rx="2.5" fill="#90beac"/><rect x="242" y="229" width="19" height="5" rx="2.5" fill="#6ea18d"/><rect x="266" y="229" width="19" height="5" rx="2.5" fill="#487e68"/><path d="M462 201 H497" fill="none" stroke="#6d89a7" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="502" y="150" width="190" height="103" rx="12" fill="#f3f7fc" stroke="#cfdeee" stroke-width="1.4"/><text x="597" y="190" text-anchor="middle" font-size="19" fill="#243f60" font-weight="600">Patch embedding</text><text x="597" y="222" text-anchor="middle" font-size="17" fill="#617991">4 × 4 · dim 96</text><path d="M694 201 H726" fill="none" stroke="#6d89a7" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="994" y="49" text-anchor="middle" font-size="18" fill="#526e8b">Window / shifted-window attention</text><text x="994" y="77" text-anchor="middle" font-size="16" fill="#748aa0">Patch merging between stages</text><rect x="732" y="125" width="116" height="149" rx="12" fill="#f0f5fc" stroke="#cfdeee" stroke-width="1.4"/><path d="M744 125 H836 Q848 125 848 137 V170 H732 V137 Q732 125 744 125" fill="#6589b2"/><text x="790" y="154" text-anchor="middle" font-size="19" fill="#fff" font-weight="600">Stage 1</text><text x="790" y="209" text-anchor="middle" font-size="17" fill="#243f60">2 blocks</text><text x="790" y="239" text-anchor="middle" font-size="17" fill="#5b7590">3 heads</text><path d="M850 201 H860" fill="none" stroke="#6d89a7" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="862" y="125" width="116" height="149" rx="12" fill="#e8f0fa" stroke="#cfdeee" stroke-width="1.4"/><path d="M874 125 H966 Q978 125 978 137 V170 H862 V137 Q862 125 874 125" fill="#527ca9"/><text x="920" y="154" text-anchor="middle" font-size="19" fill="#fff" font-weight="600">Stage 2</text><text x="920" y="209" text-anchor="middle" font-size="17" fill="#243f60">2 blocks</text><text x="920" y="239" text-anchor="middle" font-size="17" fill="#5b7590">6 heads</text><path d="M980 201 H990" fill="none" stroke="#6d89a7" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="992" y="125" width="116" height="149" rx="12" fill="#deeaf8" stroke="#cfdeee" stroke-width="1.4"/><path d="M1004 125 H1096 Q1108 125 1108 137 V170 H992 V137 Q992 125 1004 125" fill="#416e9e"/><text x="1050" y="154" text-anchor="middle" font-size="19" fill="#fff" font-weight="600">Stage 3</text><text x="1050" y="209" text-anchor="middle" font-size="17" fill="#243f60">6 blocks</text><text x="1050" y="239" text-anchor="middle" font-size="17" fill="#5b7590">12 heads</text><path d="M1110 201 H1120" fill="none" stroke="#6d89a7" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1122" y="125" width="116" height="149" rx="12" fill="#d1e2f5" stroke="#cfdeee" stroke-width="1.4"/><path d="M1134 125 H1226 Q1238 125 1238 137 V170 H1122 V137 Q1122 125 1134 125" fill="#315e90"/><text x="1180" y="154" text-anchor="middle" font-size="19" fill="#fff" font-weight="600">Stage 4</text><text x="1180" y="209" text-anchor="middle" font-size="17" fill="#243f60">2 blocks</text><text x="1180" y="239" text-anchor="middle" font-size="17" fill="#5b7590">24 heads</text><path d="M1180 276 V303 H992 V326" fill="none" stroke="#6d89a7" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="732" y="330" width="506" height="88" rx="12" fill="#eef4fc" stroke="#cfdeee" stroke-width="1.4"/><text x="985" y="363" text-anchor="middle" font-size="16" fill="#243f60" font-weight="600">LayerNorm → Global average pooling → Linear head</text><text x="985" y="393" text-anchor="middle" font-size="17" fill="#617991">3-class or 7-class emotion prediction</text><rect x="20" y="330" width="440" height="88" rx="12" fill="#f6f1fa" stroke="#dfd1eb" stroke-width="1.4"/><text x="240" y="364" text-anchor="middle" font-size="20" fill="#77558e" font-weight="600">Post-hoc SHAP attribution</text><text x="240" y="393" text-anchor="middle" font-size="17" fill="#8b729a">Compare contributions of input segments</text><path d="M730 374 H464" fill="none" stroke="#9a7bb7" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#purple)" stroke-dasharray="7 5"/><text x="597" y="356" text-anchor="middle" font-size="14" fill="#9a7bb7">trained model</text></g></svg>